<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - EduPredict</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: linear-gradient(135deg, #091a2e 0%, #0f2b48 50%, #1a426e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: white; width: 100%; max-width: 440px; border-radius: var(--radius-lg); box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 36px 32px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--color-primary); margin: 0;">Password Recovery</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;">Enter your registered institutional email to receive a password reset link.</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-envelope"></i>
          <input type="email" name="email" class="form-control" required placeholder="your.name@college.edu">
        </div>
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-teal" style="width: 100%; padding: 12px;">Send Recovery Link</button>
      </div>

      <div style="margin-top: 20px; text-align: center; font-size: 0.82rem; color: var(--text-muted);">
        Back to <a href="{{ url_for('login') }}" style="color: var(--color-teal); font-weight: 600;">Sign In</a>
      </div>
    </form>
  </div>
</body>
</html>
